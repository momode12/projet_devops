services:

  db:
    image: postgres:14
    container_name: project_devops
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: devops_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    image: hertin12/projet_devops:latest
    container_name: devops_project
    ports:
      - "5000:5000"
    environment:
      DOCKER_ENV: true
      DATABASE_URL: postgresql://postgres:admin@db:5432/devops_db
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data: