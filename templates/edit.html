{% extends 'base.html' %}

{% block title %}Modifier {{ user.prenom }} {{ user.nom }}{% endblock %}

{% block content %}
<h1 class="mb-4">Modifier l'Utilisateur</h1>

<form method="POST" class="card p-4 shadow-sm">
    <div class="mb-3">
        <label for="nom" class="form-label">Nom *</label>
        <input type="text" class="form-control" id="nom" name="nom" value="{{ user.nom }}" required>
    </div>
    
    <div class="mb-3">
        <label for="prenom" class="form-label">Prénom *</label>
        <input type="text" class="form-control" id="prenom" name="prenom" value="{{ user.prenom }}" required>
    </div>
    
    <div class="mb-3">
        <label for="email" class="form-label">Email *</label>
        <input type="email" class="form-control" id="email" name="email" value="{{ user.email }}" required>
    </div>
    
    <div class="mb-3">
        <label for="telephone" class="form-label">Téléphone</label>
        <input type="tel" class="form-control" id="telephone" name="telephone" value="{{ user.telephone or '' }}">
    </div>
    
    <div class="d-flex gap-2">
        <button type="submit" class="btn btn-success">💾 Sauvegarder</button>
        <a href="{{ url_for('index') }}" class="btn btn-secondary">❌ Annuler</a>
    </div>
</form>
{% endblock %}
